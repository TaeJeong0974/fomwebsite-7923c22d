<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summit 2025 | The Future of Innovation Conference</title>

    <!-- DNS prefetch for third-party origins -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />

    <!-- Preload critical fonts (above-the-fold weights only) -->
    <link rel="preload" href="/fonts/ITC_Avant_Garde_Gothic_Pro-Book.otf" as="font" type="font/otf" crossorigin />
    <link rel="preload" href="/fonts/ITC_Avant_Garde_Gothic_Pro-Medium.otf" as="font" type="font/otf" crossorigin />

    <!-- Preload body background image (discovered late by CSS parser) -->
    <link rel="preload" href="/images/transition-bg-v2.png" as="image" />
    <meta
      name="description"
      content="Join 5,000+ innovators, creators, and visionaries at Summit 2025. March 15-17 in San Francisco. Groundbreaking talks, workshops, and networking."
    />
    <meta name="author" content="Summit Conference" />

    <meta property="og:title" content="Summit 2025 | The Future of Innovation Conference" />
    <meta property="og:description" content="Join 5,000+ innovators at Summit 2025. March 15-17 in San Francisco." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@summit2025" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />
    <script>
      (function(w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({
          'gtm.start': new Date().getTime(),
          event: 'gtm.js'
        });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != 'dataLayer' ? '&l=' + l : '';
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, 'script', 'dataLayer', 'GTM-KJNFHT58');
    </script>
  </head>

  <body>
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KJNFHT58"
        height="0"
        width="0"
        style="display:none;visibility:hidden"
      >
      </iframe>
    </noscript>
    <div id="root">
      <!-- Pre-React skeleton: renders instantly, replaced on hydration -->
      <style>
        .shell-skeleton { max-width: 1280px; margin: 0 auto; padding: 0 1.5rem; }
        .shell-bone { background: rgba(0,0,0,0.04); border-radius: 0.75rem; }
        .shell-shimmer { position: relative; overflow: hidden; }
        .shell-shimmer::before {
          content: ''; position: absolute; inset: 0;
          transform: translateX(-100%);
          background: linear-gradient(90deg, transparent, rgba(0,0,0,0.03), transparent);
          animation: shell-shimmer 1.5s infinite;
        }
        @keyframes shell-shimmer { 100% { transform: translateX(100%); } }
        /* Hide skeleton once React mounts */
        #root > [data-reactroot] ~ .shell-preloader,
        #root > div:not(.shell-preloader) ~ .shell-preloader { display: none; }
      </style>
      <div class="shell-preloader" aria-hidden="true">
        <!-- Nav skeleton -->
        <div class="shell-skeleton" style="padding-top:1.25rem;">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <div class="shell-bone shell-shimmer" style="width:90px;height:28px;border-radius:4px;"></div>
            <div style="display:flex;gap:1.5rem;">
              <div class="shell-bone shell-shimmer" style="width:56px;height:16px;border-radius:4px;"></div>
              <div class="shell-bone shell-shimmer" style="width:48px;height:16px;border-radius:4px;"></div>
              <div class="shell-bone shell-shimmer" style="width:56px;height:16px;border-radius:4px;"></div>
            </div>
            <div class="shell-bone shell-shimmer" style="width:80px;height:16px;border-radius:4px;"></div>
          </div>
        </div>
        <!-- Hero skeleton -->
        <div class="shell-skeleton" style="padding-top:2rem;">
          <!-- Tagline -->
          <div style="margin-bottom:5rem;">
            <div class="shell-bone shell-shimmer" style="width:120px;height:14px;margin-bottom:6px;border-radius:4px;"></div>
            <div class="shell-bone shell-shimmer" style="width:160px;height:14px;margin-bottom:6px;border-radius:4px;"></div>
            <div class="shell-bone shell-shimmer" style="width:140px;height:14px;margin-bottom:6px;border-radius:4px;"></div>
            <div class="shell-bone shell-shimmer" style="width:100px;height:14px;border-radius:4px;"></div>
          </div>
          <!-- FOM logo placeholder -->
          <div class="shell-bone shell-shimmer" style="width:66%;height:0;padding-bottom:10%;margin-left:auto;margin-bottom:3rem;border-radius:8px;"></div>
          <!-- Host cards -->
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;">
            <div class="shell-bone shell-shimmer" style="aspect-ratio:3/4;"></div>
            <div class="shell-bone shell-shimmer" style="aspect-ratio:3/4;"></div>
            <div class="shell-bone shell-shimmer" style="aspect-ratio:3/4;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
